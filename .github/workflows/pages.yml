name: Publicar site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Extrair site do zip
        run: |
          if [ ! -f finance-pro-web.zip ]; then
            echo "ERRO: suba o arquivo finance-pro-web.zip na raiz do repositorio"
            exit 1
          fi
          rm -rf site && mkdir site
          unzip -q -o finance-pro-web.zip -d site
          if [ ! -f site/index.html ]; then
            F=$(dirname "$(find site -name index.html | head -n1)")
            mv "$F" site_tmp && rm -rf site && mv site_tmp site
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        
